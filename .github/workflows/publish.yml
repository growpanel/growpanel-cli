name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'bin/**'
  workflow_dispatch:

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Auto-bump patch if version already published
        id: bump
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @growpanel/cli version 2>/dev/null || echo "0.0.0")
          echo "Local: $LOCAL — Published: $PUBLISHED"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "Local matches published — auto-bumping patch."
            npm version --no-git-tag-version patch
            NEW=$(node -p "require('./package.json').version")
            echo "Bumped to $NEW"
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add package.json package-lock.json
            git commit -m "chore: bump to v${NEW} [skip ci]"
            git push
          fi

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
